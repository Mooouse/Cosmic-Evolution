name: Verify default mining density 32
on:
  push:
    branches: [default-resource-density-32-20261106]
    paths:
      - game.js
      - index.html
      - tests/regressions.cjs
      - .github/workflows/density32-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check syntax and full game regressions
        run: |
          node --check game.js
          node --check tests/regressions.cjs
          node tests/regressions.cjs
