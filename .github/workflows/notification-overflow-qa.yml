name: Test Bounded Notifications on Desktop and Phones
on:
  push:
    branches: [fix-notifications-overflow-20261106]
    paths:
      - game.js
      - notification-system.css
      - index.html
      - tests/notification-overflow.cjs
      - .github/workflows/notification-overflow-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --silent --no-audit --no-fund --prefix "$RUNNER_TEMP/notice-qa" playwright@1.56.1
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/notice-chromium"
          "$RUNNER_TEMP/notice-qa/node_modules/.bin/playwright" install chromium --only-shell
      - name: Stress-test 90 events at five browser viewport sizes
        shell: bash
        run: |
          set -euo pipefail
          node --check game.js
          node tests/regressions.cjs
          python3 -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/notice-server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          export NODE_PATH="$RUNNER_TEMP/notice-qa/node_modules"
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/notice-chromium"
          node tests/notification-overflow.cjs
