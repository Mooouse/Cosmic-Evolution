name: Test and publish game
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run check
      - run: node scripts/build.mjs
      - name: Create CrazyGames upload ZIP
        run: cd dist && zip -r ../crazygames-upload.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: crazygames-upload
          path: crazygames-upload.zip
          retention-days: 1
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          retention-days: 1
  deploy:
    needs: test-and-package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      actions: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment

      - name: Remove all temporary build archives after deployment
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | [.id, .name, .size_in_bytes] | @tsv' \
            > "${RUNNER_TEMP}/old-artifacts.tsv"
          removed=0
          bytes=0
          while IFS=$'\t' read -r artifact_id artifact_name artifact_size; do
            [[ -n "${artifact_id}" ]] || continue
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}" >/dev/null
            echo "Deleted ${artifact_name}: ${artifact_size} bytes (id ${artifact_id})"
            removed=$((removed + 1))
            bytes=$((bytes + artifact_size))
          done < "${RUNNER_TEMP}/old-artifacts.tsv"
          echo "Deleted ${removed} archives, ${bytes} bytes"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | [.id, .name, .size_in_bytes] | @tsv' \
            | tee "${RUNNER_TEMP}/remaining-artifacts.tsv"
          test ! -s "${RUNNER_TEMP}/remaining-artifacts.tsv"
