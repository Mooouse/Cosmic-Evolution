name: Test and publish game
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
  actions: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check game syntax and required files
        run: |
          node --check game.js
          node --check platform.js
          node --check space-meta.js
          node tests/meta.cjs
          node tests/regressions.cjs
          node tests/music.cjs
          node tests/joystick.cjs
          node tests/mobile-controls.cjs
          test -s index.html
          test -s styles.css
          test -s favicon.svg
      - name: Real browser smoke test for rewards and death
        shell: bash
        run: |
          set -euo pipefail
          npm install --silent --no-audit --no-fund --prefix "$RUNNER_TEMP/infiniti-browser-test" playwright@1.56.1
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/infiniti-chromium"
          "$RUNNER_TEMP/infiniti-browser-test/node_modules/.bin/playwright" install chromium --only-shell
          python3 -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/infiniti-server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          export NODE_PATH="$RUNNER_TEMP/infiniti-browser-test/node_modules"
          export INFINITI_SMOKE_URL="http://127.0.0.1:8765"
          timeout 220 node tests/browser-smoke.cjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload game for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          retention-days: 1
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Clean up temporary Pages archive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" --jq '.artifacts[].id' > "$RUNNER_TEMP/artifacts.txt" || true
          while IFS= read -r artifact_id; do
            [ -n "$artifact_id" ] || continue
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}" >/dev/null || true
          done < "$RUNNER_TEMP/artifacts.txt"
