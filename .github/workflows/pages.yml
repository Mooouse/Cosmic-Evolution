name: Test and publish game
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
  actions: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check game syntax and required files
        run: |
          node --check game.js
          test -s index.html
          test -s styles.css
          test -s favicon.svg
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload game for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          retention-days: 1
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Clean up temporary Pages archive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" --jq '.artifacts[].id' > "$RUNNER_TEMP/artifacts.txt" || true
          while IFS= read -r artifact_id; do
            [ -n "$artifact_id" ] || continue
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}" >/dev/null || true
          done < "$RUNNER_TEMP/artifacts.txt"
