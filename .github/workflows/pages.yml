name: Test and publish game
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run check
      - run: node scripts/build.mjs
      - name: Create CrazyGames upload ZIP
        run: cd dist && zip -r ../crazygames-upload.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: crazygames-upload
          path: crazygames-upload.zip
          retention-days: 1
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          retention-days: 1
  deploy:
    needs: test-and-package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      actions: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment

      - name: Remove archives from older successful builds
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for archive_name in github-pages crazygames-upload; do
            gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${archive_name}&per_page=100" \
              --jq '.artifacts[] | select(.workflow_run.id != (env.GITHUB_RUN_ID | tonumber)) | .id' |
            while read -r artifact_id; do
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
            done
          done

      - name: Remove current Pages upload after publication
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
            --jq '.artifacts[] | select(.name == "github-pages") | .id' \
            > "${RUNNER_TEMP}/current-pages-artifacts.txt"
          while IFS= read -r artifact_id; do
            [[ -n "${artifact_id}" ]] || continue
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}" >/dev/null
            echo "Deleted successfully deployed Pages artifact ${artifact_id}"
          done < "${RUNNER_TEMP}/current-pages-artifacts.txt"
